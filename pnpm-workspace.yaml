packages:
  - 'apps/*'
  - 'packages/*'
  - 'examples/*'

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# Install only versions published at least 3 days ago (matches Dependabot, and keeps
# brand-new and possibly compromised releases out of the lockfile).
minimumReleaseAge: 4320
